<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 생기부 컨설팅 솔루션</title>
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="css/style.css">
    <!-- Google Fonts (Pretendard or similar) can be added here -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>

<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <nav class="sidebar">
            <div class="logo-area">
                <i class="fa-solid fa-graduation-cap"></i>
                <span>Edu.AI</span>
            </div>
            <div class="sidebar-action" style="padding: 0 0.5rem 1.5rem 0.5rem;">
                <button class="btn-primary"
                    style="width: 100%; justify-content: center; height: 45px; font-weight: 700;"
                    onclick="openProfileModal()">
                    <i class="fa-solid fa-user-pen"></i> 정보 입력하기
                </button>
            </div>
            <ul class="nav-menu">
                <li class="nav-item active" data-tab="stage1">
                    <i class="fa-solid fa-chart-pie"></i>
                    <span>대학 분석</span>
                </li>
                <li class="nav-item" data-tab="stage2">
                    <i class="fa-solid fa-lightbulb"></i>
                    <span>탐구 가이드</span>
                </li>
                <li class="nav-item" data-tab="admin">
                    <i class="fa-solid fa-sliders"></i>
                    <span>Admin</span>
                </li>
            </ul>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header (User Profile Summary) -->
            <header class="top-bar">
                <div class="top-bar-left"></div>
                <div class="user-status" id="userStatus">
                    <!-- Dynamic status (GPA, etc.) injected here -->
                </div>
            </header>

            <!-- Corrected Class: content-view -->
            <div id="contentContainer" class="content-view">
                <!-- Views will be injected here by JS -->
            </div>
        </main>
    </div>

    <!-- Profile Modal Base -->
    <div id="profileModal" class="modal-overlay"></div>

    <!-- Scripts -->
    <script src="js/dataManager.js"></script>
    <script src="js/dbService.js"></script>
    <script src="js/aiService.js"></script>
    <script src="js/profile.js"></script>
    <script src="js/stage1.js"></script>
    <script src="js/stage2.js"></script>
    <script src="js/admin.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
