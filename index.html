<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 생기부 컨설팅 솔루션</title>
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="css/style.css?v=8">
    <link rel="stylesheet" href="css/modal_polish.css">
    <!-- Google Fonts (Pretendard or similar) can be added here -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- PDF Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>

<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <nav class="sidebar">
            <div class="logo-area">
                <i class="fa-solid fa-graduation-cap"></i>
                <span>I HATE FLYING BUGS</span>
            </div>
            <div class="sidebar-action" style="padding: 0 0.5rem 1.5rem 0.5rem;">
                <button class="btn-primary"
                    style="width: 100%; height: 45px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px;"
                    onclick="openProfileModal()">
                    <i class="fa-solid fa-user-pen"></i>
                    <span>정보 입력하기</span>
                </button>
            </div>
            <ul class="nav-menu">
                <li class="nav-item active" data-tab="stage1_1">
                    <i class="fa-solid fa-compass"></i>
                    <span>계열 추천</span>
                </li>
                <li class="nav-item" data-tab="stage1_2">
                    <i class="fa-solid fa-layer-group"></i>
                    <span>학부 선택</span>
                </li>
                <li class="nav-item" data-tab="stage1">
                    <i class="fa-solid fa-chart-pie"></i>
                    <span>대학 분석</span>
                </li>
                <li class="nav-item" data-tab="stage2">
                    <i class="fa-solid fa-lightbulb"></i>
                    <span>탐구 가이드</span>
                </li>
                <li class="nav-item" data-tab="chatbot">
                    <i class="fa-solid fa-robot"></i>
                    <span>AI 챗봇</span>
                </li>
                <li class="nav-item" data-tab="manager">
                    <i class="fa-solid fa-user-gear"></i>
                    <span>학생 관리</span>
                </li>
                <li class="nav-item" data-tab="admin">
                    <i class="fa-solid fa-sliders"></i>
                    <span>설정</span>
                </li>
                <li class="nav-item logout-btn" onclick="resetCounselingSession()"
                    style="margin-top: auto; color: #F59E0B;">
                    <i class="fa-solid fa-arrows-rotate"></i>
                    <span>상담 초기화</span>
                </li>
                <li class="nav-item" id="counselorProfileDisplay"
                    style="pointer-events: none; opacity: 0.8; font-size: 0.85rem; padding: 0.5rem 1rem;">
                    <!-- Injected by JS -->
                </li>
                <li class="nav-item logout-btn" onclick="dbService.logout()" style="color: #EF4444;">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span>로그아웃</span>
                </li>
            </ul>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header (User Profile Summary) -->
            <header class="top-bar">
                <div class="top-bar-left">
                    <!-- Breadcrumb or Title Area if needed -->
                </div>
                <!-- [NEW] Status & Memo Area wrapper -->
                <div style="display: flex; align-items: center; gap: 10px;">
                    <span class="badge"
                        style="cursor:pointer; background-color:#EFF6FF; color:#2563EB; font-weight:700;"
                        onclick="openMemoModal()">
                        <i class="fa-solid fa-pen-to-square"></i> 메모
                    </span>
                    <div class="user-status" id="userStatus">
                        <!-- Dynamic status (GPA, etc.) injected here -->
                    </div>
                </div>
            </header>

            <!-- Corrected Class: content-view -->
            <div id="contentContainer" class="content-view">
                <!-- Views will be injected here by JS -->
            </div>
        </main>
    </div>

    <!-- Profile Modal Base -->
    <div id="profileModal" class="modal-overlay"></div>

    <!-- [NEW] Memo Modal -->
    <div id="memoModal" class="modal-overlay"
        style="display: none; z-index: 10000; align-items: center; justify-content: center;">
        <div class="modal-content profile-editor" style="max-width: 500px !important;">
            <div class="modal-header" style="display: flex; justify-content: space-between; align-items: flex-start;">
                <div style="display: flex; flex-direction: column; gap: 0.25rem;">
                    <h2 style="margin: 0;"><i class="fa-solid fa-clipboard-list"></i> 상담 메모</h2>
                    <div class="modal-header-desc" style="font-size: 0.85rem; color: #64748B;">상담 내용을 기록하고 관리합니다.</div>
                </div>
                <button class="close-btn" onclick="closeMemoModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body-scroll" style="padding: 1.5rem 2rem;">
                <div class="input-wrapper">
                    <label class="input-label">대상 학생</label>
                    <input type="text" id="memoStudentName" class="styled-input" readonly
                        style="background-color:#F1F5F9; color:#64748B;">
                </div>
                <div class="input-wrapper">
                    <label class="input-label">상담 상태</label>
                    <select id="memoConsultingStatus" class="styled-input">
                        <option value="보통">🙂 보통 (안정적)</option>
                        <option value="좋음">🥰 좋음 (매우 긍정적)</option>
                        <option value="나쁨">😡 나쁨 (주의 요망)</option>
                    </select>
                </div>
                <div class="input-wrapper" style="margin-bottom: 0;">
                    <label class="input-label">상담 내용</label>
                    <textarea id="memoContentText" class="styled-input" rows="6"
                        placeholder="상담한 내용을 자유롭게 작성해주세요."></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" onclick="closeMemoModal()">닫기</button>
                <button class="btn-save" onclick="saveMemoCommand()">저장하기</button>
            </div>
        </div>
    </div>

    <!-- [NEW] Generic Confirm Modal -->
    <div id="confirmModal" class="modal-overlay"
        style="display: none; z-index: 10000; align-items: center; justify-content: center;">
        <div class="modal-content"
            style="background: white; padding: 2rem; border-radius: 12px; max-width: 400px; width: 90%; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.2);">
            <div style="font-size: 3rem; color: #F59E0B; margin-bottom: 1rem;"><i
                    class="fa-solid fa-circle-exclamation"></i></div>
            <h3 id="confirmTitle" style="margin-bottom: 0.5rem; color: #1E293B; font-size: 1.25rem;">잠깐! 확인해주세요</h3>
            <p id="confirmMessage" style="margin-bottom: 2rem; color: #475569; line-height: 1.6; word-break: keep-all;">
                ...</p>
            <div style="display: flex; gap: 0.8rem; justify-content: center;">
                <button id="confirmCancelBtn"
                    style="padding: 0.8rem 1.5rem; border-radius: 8px; border: 1px solid #E2E8F0; background: white; color: #64748B; font-weight: 600; cursor: pointer;">취소</button>
                <button id="confirmOkBtn"
                    style="padding: 0.8rem 1.5rem; border-radius: 8px; border: none; background: #EF4444; color: white; font-weight: 600; cursor: pointer; box-shadow: 0 4px 6px -1px rgba(239, 68, 68, 0.3);">확인
                    (초기화)</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/dataManager.js?v=9"></script>
    <script src="js/dbService.js?v=9"></script>
    <script src="js/aiService.js?v=9"></script>
    <script src="js/profile.js?v=9"></script>
    <script src="js/stage1_1.js?v=9"></script>
    <script src="js/stage1_2.js?v=9"></script>
    <script src="js/stage1.js?v=9"></script>
    <script src="js/stage2.js?v=9"></script>
    <script src="js/chatbot.js?v=9"></script>
    <script src="js/manager.js?v=9"></script>
    <script src="js/admin_prompts.js?v=9"></script>
    <script src="js/admin.js?v=9"></script>
    <script src="js/app.js?v=9"></script>
</body>

</html>
