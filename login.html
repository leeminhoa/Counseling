<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상담사 로그인 - AI 생기부 컨설팅 솔루션</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #F8FAFC;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        .login-card {
            background: #FFFFFF;
            width: 100%;
            max-width: 400px;
            padding: 2.5rem;
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            border: 1px solid #E2E8F0;
            text-align: center;
        }

        .login-logo {
            font-size: 3rem;
            color: var(--primary-color);
            margin-bottom: 1rem;
        }

        .login-title {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 0.5rem;
        }

        .login-subtitle {
            font-size: 0.95rem;
            color: var(--text-sub);
            margin-bottom: 2rem;
        }

        .input-group {
            margin-bottom: 1.25rem;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 0.5rem;
        }

        .input-group input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            font-size: 1rem;
            outline: none;
            transition: all 0.2s;
            box-sizing: border-box;
            /* Important for padding */
        }

        .input-group input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(14, 116, 144, 0.1);
        }

        .login-btn {
            width: 100%;
            padding: 0.85rem;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 1rem;
        }

        .login-btn:hover {
            background-color: var(--primary-hover);
        }

        .login-btn:disabled {
            background-color: #94A3B8;
            cursor: not-allowed;
        }

        .login-footer {
            margin-top: 2rem;
            font-size: 0.8rem;
            color: var(--text-sub);
            border-top: 1px solid #F1F5F9;
            padding-top: 1rem;
        }

        #errorMessage {
            color: #DC2626;
            /* Red 600 */
            font-size: 0.9rem;
            margin-top: 1rem;
            display: none;
            background-color: #FEF2F2;
            padding: 0.75rem;
            border-radius: 0.375rem;
            border: 1px solid #FECACA;
            text-align: left;
        }
    </style>
</head>

<body>

    <div class="login-card">
        <div class="login-logo">
            <i class="fa-solid fa-graduation-cap"></i>
        </div>
        <h1 class="login-title">상담사 로그인</h1>
        <p class="login-subtitle">AI 생기부 컨설팅 솔루션</p>

        <form id="loginForm">
            <div class="input-group">
                <label for="email">이메일</label>
                <input type="email" id="email" placeholder="counselor@example.com" required>
            </div>
            <div class="input-group">
                <label for="password">비밀번호</label>
                <input type="password" id="password" placeholder="비밀번호를 입력하세요" required>
            </div>

            <button type="submit" class="login-btn">
                로그인
            </button>
            <div id="errorMessage"></div>
        </form>

        <div class="login-footer">
            &copy; 2026 I HATE FLYING BUGS. All rights reserved.
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/dataManager.js"></script>
    <script src="js/dbService.js"></script>
    <script>
        // Check if already logged in
        document.addEventListener('DOMContentLoaded', () => {
            // Since dbService is async in init, we might need to wait or just check localStorage directly first
            // But dbService.checkSession uses localStorage directly, so it's synchronous.
            try {
                const session = dbService.checkSession();
                if (session) {
                    window.location.href = 'index.html';
                }
            } catch (e) {
                console.log('No session or error checking session');
            }
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMessage');
            const btn = document.querySelector('.login-btn');

            // UI Reset
            errorMsg.style.display = 'none';
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 로그인 중...';
            btn.disabled = true;

            try {
                // Initialize DB if needed (usually auto-inits but just in case)
                if (!dbService.client) await dbService.initClient();

                const result = await dbService.loginCounselor(email, password);

                if (result.success) {
                    // Success
                    window.location.href = 'index.html';
                } else {
                    throw new Error(result.message || '로그인에 실패했습니다.');
                }
            } catch (err) {
                errorMsg.innerText = err.message || '로그인 중 오류가 발생했습니다.';
                errorMsg.style.display = 'block';
                btn.innerHTML = '로그인';
                btn.disabled = false;
            }
        });
    </script>
</body>

</html>
