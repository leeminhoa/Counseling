<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Prompt Merge Test</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Pretendard', sans-serif;
            background: #F1F5F9;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-height: 100vh;
            box-sizing: border-box;
            margin: 0;
        }

        h1 {
            color: #1E293B;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .container {
            display: flex;
            gap: 1rem;
            flex-grow: 1;
            height: 100%;
            overflow: hidden;
        }

        .panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            overflow: hidden;
        }

        .panel-header {
            background: #E2E8F0;
            padding: 1rem;
            font-weight: 700;
            color: #475569;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        textarea {
            flex-grow: 1;
            padding: 1rem;
            border: none;
            font-family: 'Menlo', 'Monaco', monospace;
            font-size: 14px;
            line-height: 1.5;
            outline: none;
            resize: none;
            background: #FAFAFA;
        }

        .arrow-area {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 1rem;
            width: 60px;
        }

        .btn-merge {
            background: #3B82F6;
            color: white;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            box-shadow: 0 4px 10px rgba(59, 130, 246, 0.3);
            transition: transform 0.1s;
        }

        .btn-merge:active {
            transform: scale(0.95);
        }

        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .status-success {
            background: #ECFDF5;
            color: #059669;
        }

        .status-warn {
            background: #FFFBEB;
            color: #D97706;
        }

        .status-error {
            background: #FEF2F2;
            color: #DC2626;
        }

        .highlight {
            background: #FEF9C3;
        }
    </style>
</head>

<body>

    <h1><i class="fa-solid fa-wand-magic-sparkles" style="color: #3B82F6;"></i> 프롬프트 자동 병합 시뮬레이터</h1>
    <p style="margin-top:0; color: #64748B; margin-bottom: 1.5rem;">
        사용자가 입력한 <strong>"내용 지침(텍스트)"</strong>에서 잘못된 출력 형식을 감지하고, 시스템의 <strong>"완벽한 JSON 스키마"</strong>를 자동으로 결합하는 로직을
        테스트합니다.
    </p>

    <div class="container">
        <!-- Input -->
        <div class="panel">
            <div class="panel-header">
                📝 사용자 입력 (Settings)
                <span class="status-badge status-warn" id="inputStatus">분석 대기중</span>
            </div>
            <textarea id="inputPrompt" placeholder="여기에 선생님의 프롬프트(텍스트 형식 포함)를 붙여넣으세요..."></textarea>
        </div>

        <!-- Action -->
        <div class="arrow-area">
            <button class="btn-merge" id="btnMerge" title="병합 실행"><i class="fa-solid fa-arrow-right"></i></button>
        </div>

        <!-- Output -->
        <div class="panel">
            <div class="panel-header">
                ✨ 최종 병합 결과 (To AI)
                <button onclick="copyResult()"
                    style="background:white; border:1px solid #CBD5E1; padding:4px 8px; border-radius:4px; cursor:pointer;">복사</button>
            </div>
            <textarea id="outputPrompt" readonly></textarea>
        </div>
    </div>

    <script>
        // [System Define] The Perfect JSON Schema (Copied from aiService.js)
        const OFFICIAL_JSON_SCHEMA = `
[출력 구조 및 작성 가이드 (JSON 필드별 작성 지침)]

[Page 1: Summary]
- profile_summary: 학생 프로필 요약 (지망학과와 수강과목을 한 줄로 요약).
- anchor_theme: 이번 학기 컨셉. 어려운 주제어 대신, 학생이 보여줘야 할 '구체적인 모습/강점'을 한 문장으로 정의.
- sub_keywords: anchor_theme과 관련된 쉬운 핵심 키워드 3개 (#해시태그).
- representative_outputs:
  1) 세특용: (계기→교과/활동→구체적 방법→결과물) 구조. 학생이 '할 수 있는' 수준으로 제안.
  2) 창체용: (계기→활동→구체적 방법→결과물) 구조.
- teacher_record_guide: 교사가 생기부에 그대로 참고할 수 있는 문장 (트리거 → 교과원리 적용 → 탐구활동 → 성장/변화).
- checklist: 이번 주 바로 할 일 3가지 (진입장벽 낮게: 유튜브 영상 키워드, 도서관 목차 훑기, 교과서 펼쳐보기).

[Page 2: Execution Plan]
- subject_table: 과목별 세특 설계. (주력 3개 + 보조 2~3개)
  * 주의: 22개정 교과서에 나온 실제 개념만 활용. 활동은 '제안서 작성'처럼 기획/탐구 단계로 설정.
  * 컬럼: 과목 | 교과개념(교과서 수준) | 전공연결질문(호기심) | 활동(조사/발표/에세이/문제풀이) | 결과물(증거)
- creative_experience: 창체 활동 추천 (선택형 옵션 제공)
  * club_options: 동아리 ([OO 성격의 동아리라면] 가정). (주제/실행3단계/증거물).
  * career_options: 진로 (뉴스 스크랩, 롤모델 탐구 등 혼자 할 수 있는 활동). (주제/실행3단계/증거물).
  * autonomous_options: 자율 (학급 기여, 환경 개선 등). (주제/실행3단계/증거물).
- consulting_questions: 학생의 관심사를 이끌어내고 활동 가능 여부를 체크하는 질문 리스트 6~8개.

[Trigger Bank (2025)]
- books: 추천 도서 3권. 컨셉과 세특 활동을 지원할 수 있는 자료.
  * title: "도서명 (저자 / 출판사 / ISBN)" 형식으로 작성. ISBN 필수(불확실하면 '확인필요').
  * desc: "핵심 내용 요약 (책의 줄거리 및 주요 논점)"
  * connection: "활용: 과목/활동 연결 (구체적 적용 방안)"
- keywords: 트렌드 키워드 3개. 공신력 있는 용어.
  * keyword: "키워드명"
  * desc: "정의 및 핵심 설명"
  * connection: "활용: 탐구 주제 연결 (구체적 적용 방안)"

[필수 출력 형식]
반드시 아래 JSON 포맷을 엄격히 준수하여 응답하세요. 마크다운이나 추가 설명 없이 JSON만 반환합니다. Note: 'representative_outputs'는 배열이어야 합니다.

[IMPORTANT] Output strictly in JSON format as defined:
{
  "page1": {
    "summary": {
      "profile_summary": "학생 프로필 요약 (지망학과 / 수강과목 요약)",
      "anchor_theme": "이번 학기 컨셉 (구체적인 모습/강점)",
      "sub_keywords": ["키워드1", "키워드2", "키워드3"],
      "representative_outputs": [
        { "title": "세특 중심 대표 산출물 제목", "detail": "(WHY 계기) ... → (WHAT 교과/활동) ... → (HOW 방법) ... → (RESULT 결과물) ..." },
        { "title": "창체 중심 대표 산출물 제목", "detail": "(WHY 계기) ... → (WHAT 활동) ... → (HOW 방법) ... → (RESULT 결과물) ..." }
      ],
      "teacher_record_guide": "교사 기록용 한 문장 뼈대 (트리거→교과원리→탐구→성장)",
      "checklist": ["이번 주 할 일 1", "이번 주 할 일 2", "이번 주 할 일 3"]
    }
  },
  "page2": {
    "execution_plan": {
      "subject_table": [
        { "subject": "과목명", "concept": "연계 교과 개념", "question": "탐구 질문", "activity": "구체적 활동", "evidence": "증거물" },
        { "subject": "과목명", "concept": "연계 교과 개념", "question": "탐구 질문", "activity": "구체적 활동", "evidence": "증거물" }
      ],
      "creative_experience": {
        "club_options": [
            { "topic": "동아리 활동 주제", "steps": "실행 3단계 상세 기술 (구체적 활동 내용 포함)", "evidence": "결과물" }
        ],
        "career_options": [
            { "topic": "진로 활동 주제", "steps": "실행 3단계 상세 기술 (구체적 활동 내용 포함)", "evidence": "결과물" }
        ],
        "autonomous_options": [
            { "topic": "자율 활동 주제", "steps": "실행 3단계 상세 기술 (구체적 활동 내용 포함)", "evidence": "결과물" }
        ]
      },
      "consulting_questions": [
        "질문 1", "질문 2", "질문 3", "질문 4", "질문 5", "질문 6"
      ]
    }
  },
  "trigger_bank": {
    "books": [
      { "title": "도서명", "author": "저자", "desc": "핵심 내용 상세 서술 (줄거리 및 주요 논점 포함)", "connection": "활용: 과목/활동 연결" }
    ],
    "keywords": [
      { "keyword": "키워드명", "desc": "정의 및 상세 설명", "connection": "활용: 탐구 주제 연결" }
    ]
  }
}`;

        const inputEl = document.getElementById('inputPrompt');
        const outputEl = document.getElementById('outputPrompt');
        const statusEl = document.getElementById('inputStatus');
        const btnMerge = document.getElementById('btnMerge');

        function runSmartMerge() {
            const input = inputEl.value;
            if (!input.trim()) {
                outputEl.value = '';
                statusEl.innerHTML = '입력 대기중';
                statusEl.className = 'status-badge status-warn';
                return;
            }

            // [Logic] Detection
            // 1. Is it legacy? (Contains Text-mode indicators)
            const isLegacy = input.includes('"page1": "') || input.includes('=== (Page 1)');

            // 2. Is it already structured? (Contains [IMPORTANT] or page1 as object? - Hard to detect perferctly, but "Text Mode" detection is reliable)

            if (isLegacy) {
                // [Logic] Split & Merge
                statusEl.innerHTML = '⚡ 구버전 감지됨 -> 자동 병합 실행';
                statusEl.className = 'status-badge status-success';

                // Find Split Point
                const splitMarkers = ['[출력 구조', '[필수 출력 형식]', '=== (Page 1)'];
                let splitIndex = -1;

                for (const marker of splitMarkers) {
                    const idx = input.indexOf(marker);
                    if (idx !== -1) {
                        if (splitIndex === -1 || idx < splitIndex) splitIndex = idx;
                    }
                }

                if (splitIndex !== -1) {
                    const userInstructions = input.substring(0, splitIndex).trim();
                    const merged = userInstructions + "\n\n" + OFFICIAL_JSON_SCHEMA;
                    outputEl.value = merged;
                } else {
                    // Fallback: Just append if we can't find a clean cut
                    outputEl.value = input + "\n\n" + OFFICIAL_JSON_SCHEMA;
                }

            } else {
                // No merge needed (or undetected)
                statusEl.innerHTML = '✅ 정상/최신 형식';
                statusEl.className = 'status-badge status-success';
                outputEl.value = input; // Pass through
            }
        }

        btnMerge.addEventListener('click', runSmartMerge);
        inputEl.addEventListener('input', runSmartMerge); // Realtime

        function copyResult() {
            outputEl.select();
            document.execCommand('copy');
            alert('복사되었습니다!');
        }
    </script>
</body>

</html>
